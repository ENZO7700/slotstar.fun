# ==================================================
# SLOTSTARS.FUN - PRODUCTION PHP CONFIGURATION
# ==================================================

memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 60
max_input_time = 60
file_uploads = On

# Security Hardening
expose_php = Off
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
